name: Daily Cyber News Agent

# Builds a daily threat-intel post from REAL news feeds (see scripts/daily_intel.py).
# Uses the built-in GITHUB_TOKEN, so there is no personal access token to expire.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'   # 6:17 AM Eastern (11:17 UTC)

permissions:
  contents: write   # commit the new post
  actions: write    # start the Pages deploy workflow

concurrency:
  group: daily-intel
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build today's briefing from real feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/daily_intel.py

      - name: Commit and push (only if a post was written)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts/
          if git diff --cached --quiet; then
            echo "No new post today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily threat intel: $(TZ=America/New_York date +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run jekyll-gh-pages.yml --ref main
